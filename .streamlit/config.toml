# Calm blue instead of Streamlit's default red, so buttons and focused boxes don't look like errors.
[theme]
primaryColor = "#2563EB"

[browser]
gatherUsageStats = false

# Pick up code changes automatically while testing locally (otherwise the page keeps running old
# code until you click "Rerun"). Policy changes still need a restart: the policy is loaded once.
[server]
runOnSave = true
